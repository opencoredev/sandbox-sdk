# Pinned by multi-arch index digest (Docker Hub, read 2026-11-23):
#   postgres:16 -> PG_VERSION 16.16-1.pgdg13+1, image created 2026-11-18
#   redis:7     -> REDIS_VERSION 7.4.12, image created 2026-11-05
# The no-Docker path runs the same server versions as plain processes (bench/src/services/pins.ts).
# The harness publishes them on SBX_PG_PORT / SBX_REDIS_PORT (15432 / 16379), not the defaults, so a
# server the sandbox image already runs cannot answer for these.
name: sbx-services

services:
  postgres:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${SBX_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-h", "127.0.0.1"]
      interval: 1s
      timeout: 2s
      retries: 60

  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${SBX_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
