name: CI

on:
  push:
  pull_request:

jobs:
  # Package changes ship through the version PR, so they need a changeset.
  # The version PR that the release workflow opens is exempt.
  changeset:
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run changeset status --since=origin/${{ github.base_ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Each test task builds its package first. Run them one at a time so the
      # Next.js builds and the vitest workers never share the runner's memory.
      - run: bun run test:ci
      - run: bun run build

  # Checks the packed package and the bundled optional peers, which the unit
  # tests cannot see because they import source files.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk build
      - run: bun run smoke:package
        env:
          SKIP_BUILD: "1"
